name: Build and release

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.vscode/**'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  module_id: "AccSaberQLite"
  qmod_name: "AccSaber-Lite"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout
      with:
        fetch-depth: 0

    - uses: seanmiddleditch/gha-setup-ninja@v3

    - name: Setup canary NDK
      id: setup-ndk
      uses: ./.github/actions/canary-ndk

    - name: Create ndkpath.txt
      run: |
        echo ${{ steps.setup-ndk.outputs.ndk-path }} > ${GITHUB_WORKSPACE}/ndkpath.txt
        cat ${GITHUB_WORKSPACE}/ndkpath.txt

    - name: Compute next version
      id: version
      run: |
        latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
        if [ -z "$latest" ]; then
          next="v0.0.1"
        else
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
        fi
        echo "TAG=${next}" >> ${GITHUB_OUTPUT}
        echo "VERSION=${next#v}" >> ${GITHUB_OUTPUT}
        echo "Next release: ${next}"

    - name: Setup qpm
      run: |
        wget -q https://github.com/QuestPackageManager/QPM.CLI/releases/download/v1.5.11/qpm-linux-x64.zip -O ${HOME}/qpm.zip
        mkdir -p ${HOME}/qpm
        unzip -q ${HOME}/qpm.zip -d ${HOME}/qpm
        chmod +x ${HOME}/qpm/qpm
        echo "${HOME}/qpm" >> ${GITHUB_PATH}

    - name: QPM dependency cache
      uses: actions/cache@v4
      with:
        path: ~/.local/share/QPM-RS
        key: ${{ runner.os }}-qpm-deps-${{ hashFiles('qpm.json') }}
        restore-keys: ${{ runner.os }}-qpm-deps-

    - name: Stamp version
      run: |
        jq --arg v "${{ steps.version.outputs.VERSION }}" '.version = $v | .info.version = $v' qpm.json > qpm.json.tmp
        mv qpm.json.tmp qpm.json

    - name: Restore dependencies
      run: qpm restore

    - name: Build & Create Qmod
      run: |
        cd ${GITHUB_WORKSPACE}
        qpm s qmod

    - name: Get Library Name
      id: libname
      run: |
        cd ./build/
        pattern="lib${module_id}*.so"
        files=( $pattern )
        echo "NAME=${files[0]}" >> ${GITHUB_OUTPUT}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.libname.outputs.NAME }}
        path: ./build/${{ steps.libname.outputs.NAME }}
        if-no-files-found: error

    - name: Upload qmod artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.qmod_name }}.qmod
        path: ./${{ env.qmod_name }}.qmod
        if-no-files-found: error

    - name: Create release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no release]')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        name: ${{ env.qmod_name }} ${{ steps.version.outputs.TAG }}
        draft: false
        generate_release_notes: true
        files: |
          ./${{ env.qmod_name }}.qmod
          ./build/${{ steps.libname.outputs.NAME }}
          ./build/debug_${{ steps.libname.outputs.NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
